name: Temporary Homepage Inspection
on:
  push:
    branches:
      - tmp-homepage-inspect
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file:
          - 2024-05-15-enhancing-llms.md
          - 2025-06-01-ipsum-lorem-all-you-need.md
          - 2025-06-15-ipsum-lorem-workshop.md
          - 2025-06-20-llm-adaptive-learning.md
          - 2025-07-01-optimizing-llms-contextual-reasoning.md
    steps:
      - name: Check out homepage
        uses: actions/checkout@v4
        with:
          repository: nepbvtovc8757/My-Homepage
          ref: master
      - name: Show publication
        run: sed -n '1,80p' "_publications/${{ matrix.file }}"
